name: Module debug snapshot
on:
  push:
    branches: [refactor/client-data-performance]
    paths: [.github/workflows/module-debug-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the pending source snapshot
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, textwrap
          workflow = pathlib.Path('.github/workflows/module-refactor-validation.yml').read_text()
          step = workflow.split('      - name: Apply verified module source snapshot\n',1)[1].split('      - run: npm ci\n',1)[0]
          script = pathlib.Path(os.environ['RUNNER_TEMP'], 'restore-module-snapshot.sh')
          script.write_text(textwrap.dedent(step.split('        run: |\n',1)[1]))
          subprocess.run(['bash', '-e', '-o', 'pipefail', str(script)], check=True)
          PY
      - run: npm ci
      - name: Collect pointer diagnostics without changing application behavior
        run: |
          python3 .module-transfer/debug-browser.py
          mkdir -p artifacts/choice-debug
          for mode in offline pages public; do
            args=()
            if [ "$mode" != offline ]; then args+=(--public); fi
            if [ "$mode" = pages ]; then args+=(--ad-free); fi
            status=0
            UI_SMOKE_SCREENSHOT_DIR="artifacts/choice-debug/$mode" node scripts/_debug-choice.mjs "${args[@]}" --require-browser --disable-browser-sandbox > "artifacts/choice-debug/$mode.log" 2>&1 || status=$?
            echo "$mode diagnostic exit=$status"
            tail -12 "artifacts/choice-debug/$mode.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: choice-debug
          path: artifacts/choice-debug
          retention-days: 1
