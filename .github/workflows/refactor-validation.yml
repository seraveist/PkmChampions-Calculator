name: Refactor validation

on:
  push:
    branches:
      - refactor/client-data-performance
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prepare source snapshot for isolated testing
        run: |
          git archive --format=tar HEAD -o "$RUNNER_TEMP/refactor-source.tar"
          tar -rf "$RUNNER_TEMP/refactor-source.tar" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-source
          path: ${{ runner.temp }}/refactor-source.tar
          retention-days: 1
      - run: npm test
