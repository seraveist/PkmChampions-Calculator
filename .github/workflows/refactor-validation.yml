name: Refactor validation

on:
  push:
    branches:
      - refactor/client-data-performance

permissions:
  contents: write

concurrency:
  group: client-data-refactor
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/refactor/client-data-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply verified source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          text = ''.join(p.read_text().strip() for p in sorted(pathlib.Path('.refactor-transfer').glob('part-*.b64')))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd138d6efa3631df54abcceef28ea32f286a05149825eb13cdc3103feade9ba81'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'client-performance.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/client-performance.patch"
          git apply --index "$RUNNER_TEMP/client-performance.patch"
          mkdir -p artifacts/client-refactor
      - run: npm ci
      - name: Full regression suite
        run: |
          set -euo pipefail
          npm test 2>&1 | tee artifacts/client-refactor/npm-test.log
      - name: Calculator browser contracts - Cloudflare Pages
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/calculator-pages
        run: |
          set -euo pipefail
          node scripts/calculator-remodel-browser.mjs --public --ad-free --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/calculator-pages.log
      - name: Calculator browser contracts - standalone
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/calculator-standalone
        run: |
          set -euo pipefail
          node scripts/calculator-remodel-browser.mjs --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/calculator-standalone.log
      - name: Reverse calculator browser contracts
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/reverse-pages
        run: |
          set -euo pipefail
          node scripts/reverse-exchange-browser.mjs --public --ad-free --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/reverse-pages.log
      - name: All-menu browser smoke - standalone
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/ui-standalone
        run: |
          set -euo pipefail
          node scripts/ui-remodel-final-browser.mjs --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/ui-standalone.log
      - name: All-menu browser smoke - Cloudflare Pages
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/ui-pages
        run: |
          set -euo pipefail
          node scripts/ui-remodel-final-browser.mjs --public --ad-free --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/ui-pages.log
      - name: All-menu browser smoke - advertising-ready public
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/client-refactor/screenshots/ui-public
        run: |
          set -euo pipefail
          npm run build:public
          node scripts/ui-remodel-final-browser.mjs --public --require-browser --disable-browser-sandbox 2>&1 | tee artifacts/client-refactor/ui-public.log
          npm run build:pages
          npm run pages:ready
      - name: Commit validated files only to the refactor branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/refactor/client-data-performance'
          git add pokemon-champions-calculator-v3.html docs/damage-calculator-coverage-matrix.md
          git rm -r .refactor-transfer .github/workflows/refactor-validation.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: decouple client data and retain calculator controls' -m 'Use plain-object public data and DOM-free worker initialization. Cache display lists, deduplicate effort input/change refreshes, retain result controls, and add regression/browser contracts. Preserve calculation algorithms and offline output.'
          git push origin HEAD:refs/heads/refactor/client-data-performance
          git rev-parse HEAD | tee artifacts/client-refactor/validated-commit.txt
          git show --stat --oneline HEAD > artifacts/client-refactor/change-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-refactor-validation
          path: artifacts/client-refactor
          retention-days: 7
          if-no-files-found: warn
