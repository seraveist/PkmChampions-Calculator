name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- pokemon-champions-calculator-v3.html docs/damage-calculator-coverage-matrix.md

      - name: Run public browser smoke
        run: npm run ui:browser:public -- --require-browser --disable-browser-sandbox

      - name: Build Cloudflare Pages output
        run: npm run build:pages

      - name: Verify Cloudflare Pages output
        run: npm run pages:ready
