name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        run: npm test

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- pokemon-champions-calculator-v3.html docs/damage-calculator-coverage-matrix.md

      - name: Verify uninstrumented module and offline output
        run: |
          node scripts/modules-browser.mjs --public --disable-browser-sandbox
          node scripts/modules-browser.mjs --disable-browser-sandbox

      - name: Verify slot-level calculation and retained controls
        run: |
          node scripts/calculator-remodel-browser.mjs --public --ad-free --require-browser --disable-browser-sandbox
          node scripts/calculator-remodel-browser.mjs --require-browser --disable-browser-sandbox
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/ui-smoke/calculator

      - name: Run standalone browser smoke
        run: npm run ui:browser -- --require-browser --disable-browser-sandbox
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/ui-smoke/standalone

      - name: Run public browser smoke
        run: npm run ui:browser:public -- --require-browser --disable-browser-sandbox
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/ui-smoke/public

      - name: Upload browser smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui-smoke
          if-no-files-found: ignore

      - name: Build Cloudflare Pages output
        run: npm run build:pages

      - name: Verify Cloudflare Pages output
        run: npm run pages:ready

      - name: Run Cloudflare Pages browser smoke
        run: node scripts/ui-remodel-final-browser.mjs --public --ad-free --require-browser --disable-browser-sandbox
        env:
          UI_SMOKE_SCREENSHOT_DIR: artifacts/ui-smoke/pages
