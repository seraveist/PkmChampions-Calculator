name: Sync PS data

on:
  schedule:
    # 매주 일요일 02:00 UTC (KST 11:00) 자동 실행
    - cron: '0 2 * * 0'
  workflow_dispatch: {}   # Actions 탭에서 수동 트리거 가능

permissions:
  contents: read

concurrency:
  group: sync-ps-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      korean: ${{ steps.korean.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Sync PS data files
        run: node scripts/sync-ps-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh Korean name cache (PokéAPI)
        id: korean
        # 새 포켓몬·기술이 추가됐을 수 있으므로 ko 캐시도 갱신
        run: node scripts/fetch-ko.mjs
        continue-on-error: true   # PokéAPI 일시 장애 시에도 빌드는 진행

      # The sync updates data used by both generated artifacts. Refresh both before
      # the regression suite checks that the coverage matrix is current.
      - name: Rebuild generated data and coverage matrix
        run: |
          npm run build:standalone
          npm run coverage:matrix
          npm run power:audit

      - name: Run regression suite
        run: npm test

      - name: Compare against pinned Showdown
        uses: ./.github/actions/showdown-reference

      - name: Collect synchronized outputs
        id: changes
        run: |
          node scripts/sync-patch.mjs create "$RUNNER_TEMP/sync.patch"
          if [[ -s "$RUNNER_TEMP/sync.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check updated production UI
        if: steps.changes.outputs.changed == 'true'
        run: |
          node scripts/modules-browser.mjs --public --disable-browser-sandbox
          node scripts/modules-browser.mjs --disable-browser-sandbox

      - name: Save validated changes
        if: steps.changes.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-sync
          path: ${{ runner.temp }}/sync.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-sync
          path: ${{ runner.temp }}/validated-sync
      - name: Publish to validated branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/sync-patch.mjs apply "$RUNNER_TEMP/validated-sync/sync.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: sync PS data $(date -u +%F)"
          git push origin "HEAD:refs/heads/$BRANCH"

  summary:
    if: always()
    needs: [sync, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record outcome
        env:
          VALIDATION: ${{ needs.sync.result }}
          CHANGED: ${{ needs.sync.outputs.changed }}
          PUBLICATION: ${{ needs.publish.result }}
          KOREAN: ${{ needs.sync.outputs.korean }}
        run: |
          {
            echo "## PS data sync"
            echo "Validation: $VALIDATION · Changed: ${CHANGED:-unknown} · Publication: $PUBLICATION"
            if [[ "$KOREAN" == failure ]]; then
              echo "Korean refresh failed. The last translation cache was used."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
