<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 챔피언스 랩 (POKEMON CHAMPIONS LAB)</title>
<meta name="description" content="포켓몬 챔피언스 룰에 맞춘 대미지 계산기, 형태 역계산, 세부조정, 상성표, 도감을 한 화면에서 다루는 정적 웹앱입니다.">
<meta name="application-name" content="포켓몬 챔피언스 랩">
<meta name="apple-mobile-web-app-title" content="포켓몬 챔피언스 랩">
<meta name="theme-color" content="#eef2f6">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="index,follow">
<meta property="og:site_name" content="포켓몬 챔피언스 랩">
<meta property="og:title" content="포켓몬 챔피언스 랩">
<meta property="og:description" content="챔피언스 룰 기반 대미지 계산, 형태 역계산, 세부조정, 상성표, 도감을 제공하는 정적 웹앱입니다.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="포켓몬 챔피언스 랩">
<meta name="twitter:description" content="챔피언스 룰 기반 대미지 계산, 형태 역계산, 세부조정, 상성표, 도감을 제공하는 정적 웹앱입니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f4f6f8'/%3E%3Cpath d='M8 32a24 24 0 1 1 48 0H8Z' fill='%23d64c56'/%3E%3Cpath d='M8 32a24 24 0 1 0 48 0H8Z' fill='%23ffffff'/%3E%3Cpath d='M8 31h48v4H8z' fill='%2317202a'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2317202a'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
<script>
(function () {
  try {
    var savedTheme = localStorage.getItem('pkchamps-theme');
    if (savedTheme === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<style>
/* __INLINE_CSS__ */
</style>
</head>
<body>
<a class="skip-link" href="#appContent">본문으로 건너뛰기</a>

<header class="app-header">
  <div class="header-top">
    <div class="header-brand">
      <svg class="brand-rotom" viewBox="0 0 36 40" fill="none" aria-hidden="true"><path d="M8 9 2 3l2 17 6 2-2 15 10-6 10 6-2-15 6-2 2-17-6 6Z" fill="currentColor"/><rect x="9" y="10" width="18" height="17" rx="5" fill="var(--panel)"/><path d="m12 16 4 2m8-2-4 2" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="brand-text"><h1>포켓몬 챔피언스 <b>랩</b></h1><div class="brand-sub">POKÉMON CHAMPIONS LAB</div></div>
    </div>
    <div class="header-actions" aria-label="화면 설정">
      <button type="button" class="ui-label-action party-preset-button" id="partyPresetOpen" aria-label="파티 프리셋 열기">파티</button>
      <button type="button" class="ui-button icon-button theme-toggle-button" id="themeToggle" aria-pressed="false" aria-label="다크 테마로 전환"><span class="theme-toggle-text">다크</span></button>
    </div>
  </div>
  <nav class="main-nav" aria-label="주요 메뉴" role="tablist">
    <button type="button" id="nav-calc" class="nav-tab active" data-page="calc" role="tab" aria-controls="page-calc" aria-selected="true" tabindex="0">계산기</button>
    <button type="button" id="nav-revcalc" class="nav-tab" data-page="revcalc" role="tab" aria-controls="page-revcalc" aria-selected="false" tabindex="-1">역계산</button>
    <button type="button" id="nav-finetune" class="nav-tab" data-page="finetune" role="tab" aria-controls="page-finetune" aria-selected="false" tabindex="-1">세부조정</button>
    <button type="button" id="nav-matchup" class="nav-tab" data-page="matchup" role="tab" aria-controls="page-matchup" aria-selected="false" tabindex="-1">상성표</button>
    <button type="button" id="nav-dex" class="nav-tab" data-page="dex" role="tab" aria-controls="page-dex" aria-selected="false" tabindex="-1">도감</button>
  </nav>
  <div id="pageLoadStatus" class="page-load-status" role="status" aria-live="polite" hidden></div>
</header>

<div class="site-shell">
  <aside class="ad-rail ad-rail-left" aria-label="왼쪽 광고 영역">
    <div class="ad-slot ad-slot-rail">
      <span>광고</span>
    </div>
  </aside>

  <main id="appContent" class="app-content" tabindex="-1">
    <!-- 대미지 계산기 -->
    <section id="page-calc" class="page page-frame active" role="tabpanel" aria-labelledby="nav-calc" aria-hidden="false">
      <div class="page-heading"><h2>대미지 계산기</h2></div>
      <div class="battle-grid">
        <section class="ui-panel participant-panel atk"><div class="ui-panel-body" id="atk-body" data-calc-side="atk"></div></section>
        <button type="button" class="ui-button icon-button swap-button" id="btnSwapSides" aria-label="공격측과 방어측 교대"><span data-ui-icon="swap"></span></button>
        <section class="ui-panel participant-panel defense def"><div class="ui-panel-body" id="def-body" data-calc-side="def"></div></section>
      </div>
      <details class="field-panel ui-surface" id="calc-field-panel"><summary class="ui-disclosure" id="calc-field-head"><span class="field-label"><span data-ui-icon="settings"></span>필드 설정</span><span id="calc-field-summary"></span><span data-ui-icon="chevron"></span></summary>
        <div class="field-controls" id="calc-field-controls"></div>
        <div class="field-checks calc-field-checks"><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="autoEntry" checked>등장 특성</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="defReflect">리플렉터</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="defLightScreen">빛의장막</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="gravity">중력</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="atkHelpingHand">도우미</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="ruinSword">검의재앙</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="ruinTablet">목간의재앙</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="ruinBeads">구슬의재앙</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" id="ruinVessel">그릇의재앙</label>
          <label class="ui-check"><input class="ui-checkbox" type="checkbox" data-power-field="trickRoom">트릭룸</label>
          <label class="ui-check"><input class="ui-checkbox" type="checkbox" data-calc-tailwind="atk">내 순풍</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" data-calc-tailwind="def">상대 순풍</label>
          <label class="ui-check"><input class="ui-checkbox" type="checkbox" data-power-field="allyBattery">배터리</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" data-power-field="allyPowerSpot">파워스폿</label><label class="ui-check"><input class="ui-checkbox" type="checkbox" data-power-field="allyFriendGuard">프렌드가드</label>
        </div>
      </details>
      <section class="calc-results-panel results-section" id="damage-results"><div class="section-heading"><h3>기술별 피해</h3><div class="ui-surface target-summary" id="target-hp"></div></div><div id="entry-effects" class="entry-effects"></div><div id="calc-results-body" class="move-rows ui-surface"></div></section>
      <p id="calculation-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>

    <!-- 형태 역계산 -->
    <section id="page-revcalc" class="page page-frame tool-page" role="tabpanel" aria-labelledby="nav-revcalc" aria-hidden="true" hidden>
      <div class="page-heading"><h2>형태 역계산</h2><button type="button" class="btn-secondary ui-btn ui-btn-secondary" id="rcNewObservation">새 관측</button></div>
      <div class="rc-grid">
        <section class="ui-panel participant-panel rc-my">
          <div class="ui-panel-head">
            <h3 class="side-label">내 포켓몬</h3>
          </div>
          <div class="ui-panel-body" id="rc-my-body"></div>
        </section>

        <section class="ui-panel participant-panel defense rc-opp">
          <div class="ui-panel-head">
            <h3 class="side-label">상대 포켓몬</h3>
          </div>
          <div class="ui-panel-body" id="rc-opp-body"></div>
        </section>
      </div>

      <section class="ui-panel rc-stage-panel" id="rc-input-panel" data-rc-stage="observations" data-stage-state="locked" aria-disabled="true">
        <div class="ui-panel-head">
          <h3 class="ui-panel-title">한 턴 관측</h3>
        </div>
        <div class="ui-panel-body" id="rc-input-body"></div>
      </section>

      <section class="ui-panel rc-stage-panel" id="rc-results-panel" data-rc-stage="results" data-stage-state="locked" aria-disabled="true">
        <div class="ui-panel-head">
          <h3 class="ui-panel-title">형태 분석 결과</h3>
          <div class="ui-action-row ui-panel-actions">
            <span class="ui-panel-tag rc-stage-status" id="rc-results-stage-status">대기</span>
            <button type="button" class="btn-calculate rc-analyze-btn ui-btn ui-btn-primary" id="rcAnalyze" aria-controls="rc-results-body" aria-pressed="false">형태 분석</button>
          </div>
        </div>
        <div class="ui-panel-body" id="rc-results-body">
          <div class="empty-state ui-empty ui-empty--compact ui-empty--guide">참가 포켓몬을 선택하면 형태 분석을 준비합니다.</div>
        </div>
      </section>
    </section>

    <!-- 세부조정 -->
    <section id="page-finetune" class="page page-frame tool-page" role="tabpanel" aria-labelledby="nav-finetune" aria-hidden="true" hidden>
      <div class="page-heading"><h2>세부조정</h2></div>
      <div class="ft-layout" id="ft-layout">
        <section class="ui-panel participant-panel ft-editor"><div class="ui-panel-head"><h3 class="side-label">내 포켓몬</h3></div><div class="ui-panel-body" id="ft-my-body"></div></section>
        <section class="ui-panel participant-panel defense ft-speed-panel"><div class="ui-panel-head"><h3 class="side-label">상대 / 스피드</h3></div><div class="ui-panel-body">
          <div id="ft-opp-body"></div>
          <section class="ft-speed-embedded"><div class="section-heading"><h3>스피드 비교</h3><label class="ft-margin-field">차이 <span class="ui-number-prefix"><span aria-hidden="true">+</span><input class="ui-control ui-number" type="number" inputmode="numeric" id="ftMargin" min="0" max="999" value="1" aria-label="추월 마진"></span></label></div>
            <label class="form-field">상대 속도 직접 입력<input class="ui-control ui-number" type="number" id="ftTargetSpeed" min="1" max="10000" placeholder="선택"></label>
            <div id="ft-speed-body"></div>
          </section>
        </div></section>
        <section class="ui-panel ft-hp-panel" id="ft-hp-panel" hidden><div class="ui-panel-head"><h3>HP 기준점</h3></div><div class="ui-panel-body" id="ft-hp-body"></div></section>
      </div>
    </section>

    <!-- 상성표 -->
    <section id="page-matchup" class="page page-frame tool-page" role="tabpanel" aria-labelledby="nav-matchup" aria-hidden="true" hidden>
      <div class="page-heading"><h2>상성표</h2><button type="button" class="ui-label-action" data-party-import-target="matchup">파티 불러오기</button></div>
      <div class="matchup-mode-tabs" id="matchupModeTabs" aria-label="상성표 모드" role="tablist">
        <button type="button" class="ui-button ui-button--filter matchup-mode-btn active" data-matchup-mode="defense" role="tab" aria-selected="true" tabindex="0">방어 상성</button>
        <button type="button" class="ui-button ui-button--filter matchup-mode-btn" data-matchup-mode="coverage" role="tab" aria-selected="false" tabindex="-1">타점 분석</button>
      </div>
      <div class="matchup-slots" id="matchupSlots"></div>
      <details class="field-panel ui-surface" id="matchupCoverageField" hidden><summary class="ui-disclosure"><span class="field-label"><span data-ui-icon="settings"></span>필드 설정</span><span data-ui-icon="chevron"></span></summary><div class="field-controls">
        <label class="form-field">날씨<span class="ui-select"><select class="ui-control" id="matchup-weather"><option value="none">없음</option><option value="Sun">쾌청</option><option value="Rain">비</option><option value="Sand">모래바람</option><option value="Snow">눈</option></select><span data-ui-icon="chevron"></span></span></label>
        <label class="form-field">필드<span class="ui-select"><select class="ui-control" id="matchup-terrain"><option value="none">없음</option><option value="Electric">일렉트릭</option><option value="Grassy">그래스</option><option value="Misty">미스트</option><option value="Psychic">사이코</option></select><span data-ui-icon="chevron"></span></span></label>
      </div></details>
      <div class="matchup-coverage-inputs" id="matchupCoverageInputs"></div>
      <section class="matchup-results-panel"><div class="section-heading"><h3>타입별 분포</h3><span class="matchup-scroll-hint" id="matchupScrollHint" role="status" hidden>좌우 스크롤</span></div>
        <div class="matchup-table-wrap" role="region" aria-label="상성 결과 표" tabindex="0"><table class="ui-data-table matchup-table" id="matchupTable"><thead id="matchupHead"></thead><tbody id="matchupBody"></tbody></table></div>
        <div class="matchup-legend" id="matchupLegend"></div>
      </section>
    </section>

    <!-- 도감 -->
    <section id="page-dex" class="page page-frame dex-surface" role="tabpanel" aria-labelledby="nav-dex" aria-hidden="true" hidden>
      <div class="page-heading"><h2>도감</h2></div>
      <section class="dex-control-panel ui-panel">
        <div class="dex-control-head ui-panel-head">
          <div class="dex-nav" aria-label="도감 분류" role="tablist">
            <button type="button" id="dex-tab-pokemon" class="ui-button ui-button--filter dex-tab active" data-dex="pokemon" role="tab" aria-controls="dex-pokemon" aria-selected="true" tabindex="0">포켓몬</button>
            <button type="button" id="dex-tab-moves" class="ui-button ui-button--filter dex-tab" data-dex="moves" role="tab" aria-controls="dex-moves" aria-selected="false" tabindex="-1">기술</button>
            <button type="button" id="dex-tab-abilities" class="ui-button ui-button--filter dex-tab" data-dex="abilities" role="tab" aria-controls="dex-abilities" aria-selected="false" tabindex="-1">특성</button>
            <button type="button" id="dex-tab-items" class="ui-button ui-button--filter dex-tab" data-dex="items" role="tab" aria-controls="dex-items" aria-selected="false" tabindex="-1">도구</button>
          </div>
        </div>
        <div class="dex-control-body ui-panel-body">
          <div class="dex-filter-frame">
            <div class="dex-search"><label class="ui-search"><span data-ui-icon="search"></span>

              <input class="ui-control" type="search" id="dexSearch" aria-label="도감 검색" placeholder="이름, 특성으로 검색" autocomplete="off"></label><button class="ui-label-action dex-reset-btn" id="dexResetFilters" type="button" aria-label="필터 초기화">초기화</button>
            </div>
            <div class="dex-type-filter" id="dexTypeFilter"></div>
            <div class="dex-scope-filter" id="dexScopeFilter" role="group" aria-label="도감 수록 범위" hidden></div>
          </div>
        </div>
      </section>

      <div class="dex-content active" id="dex-pokemon" role="tabpanel" aria-labelledby="dex-tab-pokemon" aria-hidden="false">
        <div class="dex-table-wrap">
          <table class="ui-data-table dex-table" id="dexTablePokemon">
            <thead>
              <tr>
                <th class="sortable" data-sort="koName" aria-sort="none"><button type="button" class="dex-sort-button">이름</button></th>
                <th class="sortable" data-sort="type" aria-sort="none"><button type="button" class="dex-sort-button">타입</button></th>
                <th class="sortable num" data-sort="hp" aria-sort="none"><button type="button" class="dex-sort-button">HP</button></th>
                <th class="sortable num" data-sort="atk" aria-sort="none"><button type="button" class="dex-sort-button">공격</button></th>
                <th class="sortable num" data-sort="def" aria-sort="none"><button type="button" class="dex-sort-button">방어</button></th>
                <th class="sortable num" data-sort="spa" aria-sort="none"><button type="button" class="dex-sort-button">특공</button></th>
                <th class="sortable num" data-sort="spd" aria-sort="none"><button type="button" class="dex-sort-button">특방</button></th>
                <th class="sortable num" data-sort="spe" aria-sort="none"><button type="button" class="dex-sort-button">속도</button></th>
                <th class="sortable num" data-sort="bst" aria-sort="none"><button type="button" class="dex-sort-button">합계</button></th>
                <th>특성 1</th>
                <th>특성 2</th>
                <th>숨겨진 특성</th>
              </tr>
            </thead>
            <tbody id="dexBodyPokemon"></tbody>
          </table>
        </div>
        <nav class="dex-pagination" id="dexPagination-pokemon" aria-label="포켓몬 목록 페이지" aria-live="polite"></nav>
      </div>

      <div class="dex-content" id="dex-moves" role="tabpanel" aria-labelledby="dex-tab-moves" aria-hidden="true" hidden>
        <div class="dex-table-wrap">
          <table class="ui-data-table dex-table" id="dexTableMoves">
            <thead>
              <tr>
                <th class="sortable" data-sort="koName" aria-sort="none"><button type="button" class="dex-sort-button">이름</button></th>
                <th class="sortable" data-sort="type" aria-sort="none"><button type="button" class="dex-sort-button">타입</button></th>
                <th class="sortable" data-sort="cat" aria-sort="none"><button type="button" class="dex-sort-button">분류</button></th>
                <th class="sortable num" data-sort="bp" aria-sort="none"><button type="button" class="dex-sort-button">위력</button></th>
                <th class="sortable num" data-sort="acc" aria-sort="none"><button type="button" class="dex-sort-button">명중</button></th>
                <th class="sortable num" data-sort="pp" aria-sort="none"><button type="button" class="dex-sort-button">PP</button></th>
                <th class="sortable num" data-sort="pri" aria-sort="none"><button type="button" class="dex-sort-button">우선</button></th>
                <th>설명</th>
              </tr>
            </thead>
            <tbody id="dexBodyMoves"></tbody>
          </table>
        </div>
        <nav class="dex-pagination" id="dexPagination-moves" aria-label="기술 목록 페이지" aria-live="polite"></nav>
      </div>

      <div class="dex-content" id="dex-abilities" role="tabpanel" aria-labelledby="dex-tab-abilities" aria-hidden="true" hidden>
        <div class="dex-table-wrap">
          <table class="ui-data-table dex-table" id="dexTableAbilities">
            <thead>
              <tr>
                <th class="sortable" data-sort="koName" aria-sort="none"><button type="button" class="dex-sort-button">이름</button></th>
                <th>영문명</th>
                <th>설명</th>
              </tr>
            </thead>
            <tbody id="dexBodyAbilities"></tbody>
          </table>
        </div>
        <nav class="dex-pagination" id="dexPagination-abilities" aria-label="특성 목록 페이지" aria-live="polite"></nav>
      </div>

      <div class="dex-content" id="dex-items" role="tabpanel" aria-labelledby="dex-tab-items" aria-hidden="true" hidden>
        <div class="dex-table-wrap">
          <table class="ui-data-table dex-table" id="dexTableItems">
            <thead>
              <tr>
                <th class="sortable" data-sort="koName" aria-sort="none"><button type="button" class="dex-sort-button">이름</button></th>
                <th>영문명</th>
                <th>설명</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody id="dexBodyItems"></tbody>
          </table>
        </div>
        <nav class="dex-pagination" id="dexPagination-items" aria-label="도구 목록 페이지" aria-live="polite"></nav>
      </div>

      <div class="dex-content ui-panel" id="dexFullPageDetail" role="region" aria-label="도감 상세" aria-hidden="true"></div>
    </section>
  </main>

  <aside class="ad-rail ad-rail-right" aria-label="오른쪽 광고 영역">
    <div class="ad-slot ad-slot-rail">
      <span>광고</span>
    </div>
  </aside>
